name: Update blog posts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # comprobar cada día si algún post programado ya toca publicarse
  push:
    branches:
      - main
    paths:
      - 'post/*.html'
      - 'update_blog.py'
      - '.github/workflows/update_blog.yml'
      - '!post/post-template.html'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update blog listings
        run: python update_blog.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/home-content.json data/search-index.json data/content-counts.json data/topics.json posts.html sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update blog posts"
          git push
