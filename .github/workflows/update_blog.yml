name: Update blog posts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'posts/*.html'
      - 'update_blog.py'
      - 'update_sitemap.py'
      - '.github/workflows/update_blog.yml'
      - '!posts/post-template.html'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update blog listings
        run: python update_blog.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html posts.html sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update blog posts"
          git push
