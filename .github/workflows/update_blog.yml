name: Update blog posts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"  # 02:00 hora de Madrid en invierno (03:00 en verano): comprobar y publicar posts programados
  push:
    branches:
      - main

concurrency:
  group: site-content-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update blog listings
        run: python update_blog.py

      - name: Validate static SEO
        run: python scripts/check_seo.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- post index.html data/home-content.json data/search-index.json data/content-counts.json data/topics.json posts.html sitemap.xml
          if [ -d _scheduled ]; then git add -A -- _scheduled; fi
          git diff --staged --quiet || git commit -m "chore: update blog posts"
          git push
