name: Update tutorials

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tutoriales/*.html'
      - 'update_tutorials.py'
      - 'update_sitemap.py'
      - '.github/workflows/update_tutorials.yml'
      - '!tutoriales/tutorial-template.html'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Update tutorial sections
        run: python update_tutorials.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html tutoriales.html sitemap.xml
          git diff --staged --quiet || git commit -m "chore: update tutorials"
          git push