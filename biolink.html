<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Jesús F. García Gavilán · Enlaces</title>
    <meta name="description" content="Enlaces de Jesús F. García Gavilán: portafolio, LinkedIn, Substack, GitHub y METS Data.">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/jf-icon.png" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --background: #f5f5f5;
            --foreground: #2b3036;
            --primary: #130a7f;
            --accent: #6813e7;
            --border: #dddde3;
            --font-sans: 'IBM Plex Sans', Arial, sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: var(--background);
            color: var(--foreground);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            line-height: 1.65;
        }

        .biolink-container {
            width: 100%;
            max-width: 480px;
        }

        .brand-mark {
            display: block;
            width: 96px;
            height: auto;
            margin: 0 auto 32px;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 36px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-image: url('/img/jesus.jpg');
            background-size: cover;
            background-position: center 40%;
            margin: 0 auto 22px;
            border: 1px solid #b8bec9;
            padding: 4px;
            box-shadow: 0 1px 3px rgba(43, 48, 54, 0.06);
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.035em;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .profile-bio {
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            color: var(--foreground);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 3px;
            display: inline-block;
            margin-bottom: 14px;
        }

        .profile-subtitle {
            font-size: 15px;
            color: #626872;
        }

        .links-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .biolink-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 17px 22px;
            background: white;
            border: 1px solid #b8bec9;
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            color: var(--foreground);
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: border-color 0.18s, color 0.18s, transform 0.18s;
        }

        .biolink-button:hover {
            border-left-color: var(--accent);
            color: var(--primary);
            transform: translateX(3px);
        }

        .biolink-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .biolink-button svg {
            flex-shrink: 0;
            color: var(--primary);
        }

        .footer-section {
            margin-top: 36px;
            padding-top: 26px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .footer-section p {
            font-family: var(--font-mono);
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #626872;
            margin-bottom: 18px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 14px;
        }

        .social-link {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid #b8bec9;
            background: #fafafa;
            display: grid;
            place-items: center;
            color: var(--foreground);
            font-family: var(--font-mono);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.18s, color 0.18s;
        }

        .social-link:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        @media (max-width: 420px) {
            .profile-name {
                font-size: 25px;
            }

            .biolink-button {
                padding: 15px 18px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

</body>
</html>
