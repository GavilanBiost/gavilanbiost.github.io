<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="t d"><title id="t">Cifras de catálogo de plataformas de metabolómica</title><desc id="d">Las cifras corresponden a biomarcadores, paneles o bibliotecas diferentes; no son comparables como cobertura por muestra.</desc><rect width="1536" height="1024" rx="30" fill="#fffdf8"/><g font-family="Arial, sans-serif" fill="#152e39"><text x="70" y="100" font-size="48" font-weight="700">Las cifras no miden lo mismo</text><text x="70" y="153" font-size="27">Cifras de catálogo citadas en el artículo · consulta el servicio concreto</text><g transform="translate(60 195)"><rect width="1416" height="112" rx="18" fill="#e9f3ef"/><text x="26" y="46" font-size="31" font-weight="700">Nightingale</text><text x="360" y="46" font-size="34" font-weight="700">≈ 250</text><text x="360" y="88" font-size="27">Biomarcadores medidos por RMN</text></g><g transform="translate(60 325)"><rect width="1416" height="112" rx="18" fill="#edf1fa"/><text x="26" y="46" font-size="31" font-weight="700">Biocrates</text><text x="360" y="46" font-size="34" font-weight="700">Hasta 630</text><text x="360" y="88" font-size="27">Metabolitos del panel MxP Quant 500</text></g><g transform="translate(60 455)"><rect width="1416" height="112" rx="18" fill="#e9f3ef"/><text x="26" y="46" font-size="31" font-weight="700">HMT</text><text x="360" y="46" font-size="34" font-weight="700">Más de 1.300</text><text x="360" y="88" font-size="27">Metabolitos del servicio Dual Scan</text></g><g transform="translate(60 585)"><rect width="1416" height="112" rx="18" fill="#edf1fa"/><text x="26" y="46" font-size="31" font-weight="700">Metabolon</text><text x="360" y="46" font-size="34" font-weight="700">Más de 5.400</text><text x="360" y="88" font-size="27">Entradas de biblioteca: niveles 1 y 2</text></g><g transform="translate(60 715)"><rect width="1416" height="112" rx="18" fill="#e9f3ef"/><text x="26" y="46" font-size="31" font-weight="700">Sapient</text><text x="360" y="46" font-size="34" font-weight="700">Más de 15.000</text><text x="360" y="88" font-size="27">Señales de metabolitos y lípidos: cifra de la empresa</text></g><rect x="60" y="870" width="1416" height="110" rx="18" fill="#fff0c2"/><text x="88" y="915" font-size="28" font-weight="700">No equivalen a metabolitos detectados en cada muestra.</text><text x="88" y="955" font-size="26">Compara la identificación, la cuantificación y el tipo de muestra.</text></g></svg>